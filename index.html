<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKSAJ - Ikatan Santri Annuqayah Jawa</title>
    <link rel="icon" type="image/png" href="/image/logo/logo.png">
    
    <style>
        /* Base Reset & Variables */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg-cool-white: #f4f7f6; --yellow-solid: #ffcc00; --navy-dark: #0f172a; --text-main: #334155; --white-pure: #ffffff; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-cool-white); color: var(--text-main); line-height: 1.6; }

        /* HEADER CONTAINER */
        #header-placeholder { width: 100%; display: block; }

        /* HERO SECTION */
        .hero { width: 100%; display: block; }
        .hero-img { width: 100%; height: auto; display: block; object-fit: contain; }

        /* MAIN CONTAINER */
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 5%; }
        section { margin-bottom: 50px; }
        
        .section-title { font-size: 1.5rem; font-weight: 700; color: var(--navy-dark); margin-bottom: 20px; border-left: 4px solid var(--yellow-solid); padding-left: 12px; }
        .section-iframe { width: 100%; border: none; overflow: hidden; background: transparent; transition: height 0.25s ease; }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <section class="hero">
        <img src="image/hero/hero.png" alt="Hero Banner IKSAJ" class="hero-img">
    </section>

    <div class="container">
        <section id="berita">
            <h2 class="section-title">Berita Terbaru</h2>
            <iframe src="komponen_index/berita.html" class="section-iframe" scrolling="no"></iframe>
        </section>

        <section id="karya">
            <h2 class="section-title">Karya Santri</h2>
            <iframe src="komponen_index/karya.html" class="section-iframe" scrolling="no"></iframe>
        </section>

        <section id="tentang-kami">
            <h2 class="section-title">Tentang Kami</h2>
            <iframe src="komponen_index/tentang-kami.html" class="section-iframe" scrolling="no"></iframe>
        </section>

        <section id="sejarah">
            <h2 class="section-title">Sejarah</h2>
            <iframe src="komponen_index/sejarah.html" class="section-iframe" scrolling="no"></iframe>
        </section>
    </div>

    <iframe src="komponen_index/footer.html" class="section-iframe" scrolling="no" style="margin-top: 50px;"></iframe>

    <script>
        // Memuat header secara dinamis
        fetch('/komponen_index/header.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                initHeader();
            });

        function initHeader() {
            const menuBtn = document.getElementById('menu-btn');
            const navMenu = document.getElementById('nav-menu');
            
            if (menuBtn) {
                menuBtn.addEventListener('click', () => {
                    navMenu.classList.toggle('open');
                });
            }
            // Logika scroll-hide dihapus agar header statis
        }

        window.addEventListener('message', e => {
            if (e.data?.type === 'resize-iframe') {
                document.querySelectorAll('.section-iframe').forEach(iframe => {
                    if (iframe.contentWindow === e.source) iframe.style.height = e.data.height + 'px';
                });
            }
        });
    </script>
</body>
</html>
