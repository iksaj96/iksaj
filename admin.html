<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin IKSAJ</title>
    <link rel="icon" type="image/png" href="image/logo/logo.png">
    <style>
        /* Base Reset & Variables */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-pure-white: #ffffff; 
            --yellow-trans-active: rgba(255, 204, 0, 0.35); 
            --yellow-solid: #ffcc00;
            --navy-dark: #0f172a;
            --text-main: #334155;
            --white-pure: #ffffff;
            --danger-color: #ef4444;
            --content-bg: #f8fafc; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-pure-white);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- LAYOUT CONTAINER --- */
        .admin-container {
            display: flex;
            width: 100%;
            height: 100vh;
            position: relative;
            padding: 16px; 
            gap: 16px;
            background-color: var(--bg-pure-white);
        }

        /* --- MOBILE TOP BAR (ROUNDED) --- */
        .mobile-header {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            height: 52px;
            background-color: var(--navy-dark);
            color: var(--white-pure);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            border-radius: 12px;
        }

        .mobile-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .menu-toggle {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
        }

        .menu-toggle span {
            display: block;
            width: 22px;
            height: 2px;
            background-color: var(--white-pure);
            transition: all 0.3s ease;
        }

        /* --- FLOATING HOVER SIDEBAR (SUDUT BULAT & TINGGI PENUH) --- */
        sidebar {
            position: fixed;
            top: 84px; /* Posisi default di bawah header mobile saat di HP */
            bottom: 16px;
            left: -280px; 
            width: 70px; 
            
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.95) 80%, rgba(255, 204, 0, 0.2) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            
            border: 1px solid rgba(0, 0, 0, 0.06); 
            border-radius: 16px; 
            display: flex;
            flex-direction: column;
            z-index: 95; 
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), left 0.3s ease, top 0.3s ease;
            padding: 10px; 
            overflow: hidden; 
        }

        /* Desktop: Menyamakan tinggi pilar sidebar agar penuh sepadan dengan layout utama */
        @media (min-width: 769px) {
            sidebar {
                position: absolute; 
                top: 16px; /* Ditarik ke atas menyentuh batas padding kontainer luar */
                left: 16px;
            }
            
            sidebar:hover {
                width: 260px; 
                box-shadow: 12px 0 30px rgba(0, 0, 0, 0.05); 
            }
        }

        sidebar.open {
            left: 16px;
            width: 260px; 
        }

        /* Identitas Brand dengan Logo */
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 5px 20px 7px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            margin-bottom: 10px;
            white-space: nowrap;
        }

        .sidebar-logo {
            width: 36px;
            height: 36px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            transition: opacity 0.2s ease;
        }

        /* Sembunyikan teks menu saat sidebar ciut di mode desktop */
        @media (min-width: 769px) {
            sidebar:not(:hover) .brand-text,
            sidebar:not(:hover) .menu-item-text,
            sidebar:not(:hover) .logout-text {
                opacity: 0;
                pointer-events: none;
            }
        }

        .sidebar-title {
            color: var(--navy-dark);
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .sidebar-subtitle {
            color: #475569;
            font-size: 0.7rem;
            font-weight: 600;
        }

        /* Menu Navigasi */
        .sidebar-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: var(--navy-dark);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 30px; 
            white-space: nowrap;
            transition: background-color 0.25s ease;
        }

        .sidebar-menu li a svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--navy-dark);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
            margin-right: 15px; 
        }

        .menu-item-text {
            transition: opacity 0.2s ease;
        }

        .sidebar-menu li a:hover,
        .sidebar-menu li.active a {
            background-color: var(--yellow-trans-active);
            color: var(--navy-dark);
        }

        /* Tombol Logout */
        .logout-zone {
            padding: 5px;
            margin-top: auto;
        }

        .btn-logout {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            background-color: var(--danger-color);
            color: var(--white-pure);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            border-radius: 30px; 
            white-space: nowrap;
            transition: background-color 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .btn-logout svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: var(--white-pure);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
            margin-right: 15px;
        }

        .logout-text {
            transition: opacity 0.2s ease;
        }

        .btn-logout:hover {
            background-color: #dc2626;
        }

        /* --- MAIN CONTENT CONTAINER --- */
        main {
            flex: 1;
            margin-top: 68px; 
            height: calc(100vh - 100px);
            background-color: var(--content-bg);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 16px; 
            overflow: hidden; 
            position: relative;
        }

        @media (min-width: 769px) {
            main {
                margin-top: 0;
                margin-left: 86px; /* Jarak statis di kanan pilar piciut */
                height: calc(100vh - 32px); /* Tinggi penuh layar desktop berkurang padding */
            }
        }

        .content-frame {
            width: 100%;
            height: 100%;
            border: none;
            background-color: var(--content-bg);
            display: block;
        }

        /* Overlay blur mobile */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(4px);
            z-index: 80;
        }

        .sidebar-overlay.show {
            display: block;
        }

        @media (min-width: 769px) {
            .mobile-header {
                display: none;
            }
            .sidebar-overlay {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="admin-container">

        <!-- HEADER MOBILE -->
        <div class="mobile-header">
            <span class="mobile-title">IKSAJ Admin</span>
            <button class="menu-toggle" id="menu-toggle-btn" aria-label="Buka Menu">
                <span></span>
                <span style="margin: 4px 0;"></span>
                <span></span>
            </button>
        </div>

        <!-- OVERLAY BACKGROUND (Mobile Only) -->
        <div class="sidebar-overlay" id="overlay"></div>

        <!-- FLOATING HOVER SIDEBAR NAVIGASI -->
        <sidebar id="sidebar">
            <div class="sidebar-brand">
                <!-- Path Logo diarahkan tepat ke lokasi image/logo/logo.png -->
                <img src="image/logo/logo.png" alt="Logo IKSAJ" class="sidebar-logo">
                <div class="brand-text">
                    <span class="sidebar-title">IKSAJ ADMIN</span>
                    <span class="sidebar-subtitle">Panel Pengelolaan</span>
                </div>
            </div>
            
            <ul class="sidebar-menu">
                <li class="menu-item active">
                    <a href="dashboard.html" target="main-frame">
                        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
                        <span class="menu-item-text">Dashboard</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="kelola-anggota.html" target="main-frame">
                        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        <span class="menu-item-text">Anggota</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="kelola-berita.html" target="main-frame">
                        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <span class="menu-item-text">Berita</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="kelola-karya.html" target="main-frame">
                        <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                        <span class="menu-item-text">Karya</span>
                    </a>
                </li>
            </ul>

            <!-- Zona Tombol Logout -->
            <div class="logout-zone">
                <a href="index.html" class="btn-logout">
                    <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    <span class="logout-text">LOGOUT</span>
                </a>
            </div>
        </sidebar>

        <!-- KONTEN UTAMA (IFRAME) -->
        <main>
            <iframe 
                src="dashboard.html" 
                name="main-frame" 
                class="content-frame" 
                id="main-frame"
                title="Konten Utama Admin">
            </iframe>
        </main>

    </div>

    <!-- LOGIKA RESPONSIVITAS SIDEBAR MOBILE -->
    <script>
        const menuToggleBtn = document.getElementById('menu-toggle-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuItems = document.querySelectorAll('.sidebar-menu .menu-item');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }

        menuToggleBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        menuItems.forEach(item => {
            const link = item.querySelector('a');
            link.addEventListener('click', () => {
                menuItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');

                if (window.innerWidth <= 768) {
                    toggleSidebar();
                }
            });
        });
    </script>

</body>
</html>
