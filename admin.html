<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin IKSAJ</title>
    <link rel="icon" type="image/png" href="image/logo/logo.png">
    
    <script>
        if (localStorage.getItem('admin_logged_in') !== 'true') {
            window.location.href = 'login-admin.html';
        }
    </script>

    <style>
        /* Modern Reset */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { 
            --bg-app: #f2f2f7; /* iOS system background */
            --sidebar-bg: rgba(255, 255, 255, 0.8);
            --accent-yellow: #ffcc00;
            --text-primary: #1c1c1e;
            --danger-color: #ff3b30;
            --card-radius: 24px; /* Sudut melengkung khas Apple */
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-app); 
            height: 100vh; overflow: hidden; 
            color: var(--text-primary);
        }
        
        .admin-container { display: flex; width: 100%; height: 100vh; padding: 20px; gap: 20px; }

        /* Sidebar iOS Aesthetic */
        sidebar { 
            width: 260px; 
            background: var(--sidebar-bg); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(0, 0, 0, 0.05); 
            border-radius: var(--card-radius); 
            display: flex; flex-direction: column; 
            padding: 24px; flex-shrink: 0;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
        }

        .sidebar-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
        .sidebar-logo { width: 44px; height: 44px; border-radius: 12px; }
        .brand-text strong { font-size: 1.15rem; letter-spacing: -0.3px; }
        
        .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .sidebar-menu li a { 
            display: flex; align-items: center; padding: 14px 16px; 
            color: var(--text-primary); text-decoration: none; font-weight: 600; 
            border-radius: 16px; transition: all 0.3s cubic-bezier(0.2, 0, 0, 1); 
        }
        .sidebar-menu li a svg { 
            width: 22px; height: 22px; stroke: currentColor; 
            stroke-width: 2; fill: none; margin-right: 16px; flex-shrink: 0; 
        }
        .sidebar-menu li a:hover { background-color: rgba(0,0,0,0.03); }
        .sidebar-menu li.active a { background-color: var(--accent-yellow); color: #000; }

        .btn-logout { 
            margin-top: auto; display: flex; align-items: center; padding: 14px 16px; 
            background-color: transparent; color: var(--danger-color); border-radius: 16px; 
            border: 1px solid rgba(255, 59, 48, 0.2); cursor: pointer; font-weight: 600; 
            transition: all 0.2s;
        }
        .btn-logout:hover { background-color: var(--danger-color); color: white; }
        .btn-logout svg { width: 22px; height: 22px; margin-right: 16px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }

        /* Main Content iOS Aesthetic */
        main { 
            flex: 1; height: 100%; 
            background: white; border-radius: var(--card-radius); 
            overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .content-frame { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="admin-container">
        <sidebar id="sidebar">
            <div class="sidebar-brand">
                <img src="image/logo/logo.png" alt="Logo" class="sidebar-logo">
                <div class="brand-text"><strong>IKSAJ ADMIN</strong></div>
            </div>
            
            <ul class="sidebar-menu">
                <li class="menu-item active"><a href="dashboard.html" target="main-frame"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg><span>Dashboard</span></a></li>
                <li class="menu-item"><a href="kelola-anggota.html" target="main-frame"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Anggota</span></a></li>
                <li class="menu-item"><a href="kelola-berita.html" target="main-frame"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span>Berita</span></a></li>
                <li class="menu-item"><a href="kelola-karya.html" target="main-frame"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span>Karya</span></a></li>
            </ul>

            <button id="logout-btn" class="btn-logout">
                <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span>LOGOUT</span>
            </button>
        </sidebar>

        <main>
            <iframe src="dashboard.html" name="main-frame" class="content-frame" id="main-frame"></iframe>
        </main>
    </div>

    <script>
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('admin_logged_in');
            window.location.href = 'login-admin.html';
        });

        const menuItems = document.querySelectorAll('.sidebar-menu .menu-item');
        menuItems.forEach(item => {
            item.addEventListener('click', () => {
                menuItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            });
        });
    </script>
</body>
</html>
