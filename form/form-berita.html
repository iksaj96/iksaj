<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Berita - IKSAJ</title>
    <link rel="icon" type="image/png" href="../image/logo/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg-content: #f8fafc;
            --white-pure: #ffffff;
            --navy-dark: #0f172a;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success-color: #16a34a;
            --danger-color: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-content);
            color: var(--text-main);
            padding: 24px;
            line-height: 1.5;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--white-pure);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 6px;
            padding: 24px;
        }
        .header {
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            color: var(--navy-dark);
            font-size: 1.25rem;
            font-weight: 800;
        }
        .btn-back {
            background: none;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            color: var(--text-main);
            text-decoration: none;
        }
        .form-group {
            margin-bottom: 16px;
            position: relative;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--navy-dark);
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            color: var(--text-main);
            font-family: inherit;
            background-color: var(--white-pure);
        }
        .form-control:focus {
            border-color: var(--navy-dark);
        }
        textarea.form-control {
            resize: vertical;
            min-height: 160px;
        }
        .btn-submit {
            width: 100%;
            background-color: var(--navy-dark);
            color: var(--white-pure);
            border: none;
            padding: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 8px;
            transition: opacity 0.2s;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
        .btn-submit:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }
        .preview-container {
            margin-top: 8px;
            width: 100%;
            height: 220px;
            background-color: #e2e8f0;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
        }
        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .preview-placeholder {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="formTitle">Tulis Berita Baru</h1>
            <a href="../kelola-berita.html" class="btn-back">Kembali</a>
        </div>
        <form id="beritaForm">
            <div class="form-group">
                <label for="judul">Judul Berita *</label>
                <input type="text" id="judul" class="form-control" required placeholder="Masukkan judul berita utama">
            </div>
            <div class="form-group">
                <label for="kategori">Kategori *</label>
                <input type="text" id="kategori" class="form-control" required placeholder="Contoh: Kegiatan, Internal, Pengumuman">
            </div>
            <div class="form-group">
                <label for="penulis">Nama Penulis / Redaksi *</label>
                <input type="text" id="penulis" class="form-control" required placeholder="Contoh: Admin, Sekr, Humas">
            </div>
            <div class="form-group">
                <label for="status">Status Publikasi *</label>
                <select id="status" class="form-control" required>
                    <option value="Draf">Draf</option>
                    <option value="Terbit">Terbit</option>
                </select>
            </div>
            <div class="form-group">
                <label for="file_upload">Upload Gambar Cover Berita</label>
                <input type="file" id="file_upload" class="form-control" accept="image/*">
                <div class="preview-container">
                    <img id="previewImg" class="preview-img" alt="Pratinjau Gambar">
                    <span id="previewPlaceholder" class="preview-placeholder">Pilih file untuk pratinjau</span>
                </div>
            </div>
            <div class="form-group">
                <label for="konten">Konten Berita Lengkap *</label>
                <textarea id="konten" class="form-control" required placeholder="Tuliskan isi berita atau narasi artikel secara lengkap di sini..."></textarea>
            </div>
            <div class="form-group">
                <label for="tags">Tags (Pisahkan dengan koma)</label>
                <input type="text" id="tags" class="form-control" placeholder="e.g. baksos, iksaj2026, rapat">
            </div>
            <button type="submit" id="btnSubmit" class="btn-submit">Simpan Berita</button>
        </form>
    </div>

    <script type="module">
        // Import koneksi Supabase Anda (Keluar satu tingkat ke root)
        import { supabase } from '../adlan_madjied_ridho/supa.js';

        const urlParams = new URLSearchParams(window.location.search);
        const beritaId = urlParams.get('id');

        const form = document.getElementById('beritaForm');
        const formTitle = document.getElementById('formTitle');
        const btnSubmit = document.getElementById('btnSubmit');
        const fileInput = document.getElementById('file_upload');
        const previewImg = document.getElementById('previewImg');
        const previewPlaceholder = document.getElementById('previewPlaceholder');

        let currentCoverUrl = '';

        // Fungsi generate slug URL otomatis
        function generateSlug(text) {
            return text.toString().toLowerCase().trim()
                .replace(/\s+/g, '-')
                .replace(/[^\w\-]+/g, '')
                .replace(/\-\-+/g, '-')
                .replace(/^-+/, '')
                .replace(/-+$/, '');
        }

        // Kompresi gambar sisi klien demi menghemat bandwidth storage
        function compressImage(file, quality = 0.7, maxWidth = 1200) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob(resolve, 'image/jpeg', quality);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // Handler perubahan file input (Pratinjau)
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
                const compressedBlob = await compressImage(file);
                const reader = new FileReader();
                reader.onload = (ev) => {
                    previewImg.src = ev.target.result;
                    previewImg.style.display = 'block';
                    previewPlaceholder.style.display = 'none';
                };
                reader.readAsDataURL(compressedBlob);
            }
        });

        // Fungsi proses upload ke Supabase Storage (Menggunakan 'berita-bucket')
        async function uploadCover(file) {
            const fileName = `${Date.now()}.jpg`;
            
            // Diubah menggunakan 'berita-bucket' sesuai konfigurasi storage Anda
            const { data, error } = await supabase.storage.from('berita-bucket').upload(fileName, file);
            if (error) throw error;
            
            const { data: publicData } = supabase.storage.from('berita-bucket').getPublicUrl(fileName);
            return publicData.publicUrl;
        }

        // Memuat data lama jika dalam mode EDIT
        async function loadBeritaData() {
            if (!beritaId) return;
            formTitle.textContent = 'Edit Artikel Berita';
            btnSubmit.textContent = 'Perbarui Berita';
            try {
                const { data, error } = await supabase.from('berita').select('*').eq('id', beritaId).single();
                if (error) throw error;

                document.getElementById('judul').value = data.judul || '';
                document.getElementById('kategori').value = data.kategori || '';
                document.getElementById('penulis').value = data.penulis || '';
                document.getElementById('status').value = data.status || 'Draf';
                document.getElementById('konten').value = data.konten || '';
                document.getElementById('tags').value = Array.isArray(data.tags) ? data.tags.join(', ') : '';
                
                currentCoverUrl = data.gambar_url || '';
                if (currentCoverUrl) { 
                    previewImg.src = currentCoverUrl; 
                    previewImg.style.display = 'block'; 
                    previewPlaceholder.style.display = 'none'; 
                }
            } catch (err) { 
                console.error("Gagal memuat data berita:", err); 
            }
        }

        // Kirim Form (Simpan / Perbarui)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnSubmit.disabled = true;

            try {
                let imgUrl = currentCoverUrl;

                // Jika user memilih file gambar baru
                if (fileInput.files.length > 0) {
                    const compressedBlob = await compressImage(fileInput.files[0]);
                    imgUrl = await uploadCover(compressedBlob);
                }

                // Pengolahan string tags ke Array
                const tagsRaw = document.getElementById('tags').value;
                const tagsArray = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(t => t !== '') : [];

                const payload = {
                    judul: document.getElementById('judul').value,
                    kategori: document.getElementById('kategori').value,
                    penulis: document.getElementById('penulis').value,
                    status: document.getElementById('status').value,
                    konten: document.getElementById('konten').value,
                    gambar_url: imgUrl,
                    tags: tagsArray,
                    slug: generateSlug(document.getElementById('judul').value),
                    updated_at: new Date().toISOString()
                };

                const { error } = beritaId 
                    ? await supabase.from('berita').update(payload).eq('id', beritaId) 
                    : await supabase.from('berita').insert([payload]);

                if (error) throw error;

                // Redirect kembali ke halaman manajemen utama jika sukses
                window.location.href = '../kelola-berita.html';

            } catch (err) {
                alert('Gagal menyimpan berita: ' + err.message);
                console.error(err);
                btnSubmit.disabled = false;
            }
        });

        // Jalankan pengecekan data awal
        loadBeritaData();
    </script>
</body>
</html>
