<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview Dashboard - IKSAJ</title>
    <style>
        /* Apple-Inspired Styling */
        :root {
            --bg-app: #f2f2f7;
            --card-bg: #ffffff;
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --accent-yellow: #ffcc00;
            --radius-main: 24px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-app);
            color: var(--text-primary);
            padding: 32px;
            margin: 0;
        }

        .dashboard-header { margin-bottom: 32px; }
        .dashboard-header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }
        .dashboard-header p { color: var(--text-secondary); font-size: 1.1rem; margin-top: 4px; }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border-radius: var(--radius-main);
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .stat-details h3 { color: var(--text-secondary); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-number { font-size: 2rem; font-weight: 700; margin-top: 8px; }
        .stat-icon {
            width: 56px; height: 56px;
            background-color: #fff8e1;
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
        }
        .stat-icon svg { width: 28px; height: 28px; stroke: #b8860b; stroke-width: 2; fill: none; }

        /* Table Section */
        .activity-section {
            background-color: var(--card-bg);
            border-radius: var(--radius-main);
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .section-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 20px; }

        table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
        th { color: var(--text-secondary); font-size: 0.85rem; padding: 10px 16px; text-align: left; }
        td { padding: 16px; background: #fafafa; }
        td:first-child { border-top-left-radius: 12px; border-bottom-left-radius: 12px; }
        td:last-child { border-top-right-radius: 12px; border-bottom-right-radius: 12px; }

        .badge {
            padding: 6px 12px; font-size: 0.75rem; font-weight: 600;
            border-radius: 10px; text-transform: uppercase;
        }
        .badge-anggota { background: #e0f2fe; color: #0369a1; }
        .badge-berita { background: #fef9c3; color: #a16207; }
        .badge-karya { background: #dcfce7; color: #15803d; }
    </style>
</head>
<body>

    <div class="dashboard-header">
        <h1>Overview</h1>
        <p>Ringkasan aktivitas platform IKSAJ</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-details">
                <h3>Total Anggota</h3>
                <div class="stat-number">142</div>
            </div>
            <div class="stat-icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
        </div>

        <div class="stat-card">
            <div class="stat-details">
                <h3>Artikel Berita</h3>
                <div class="stat-number">48</div>
            </div>
            <div class="stat-icon"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>
        </div>

        <div class="stat-card">
            <div class="stat-details">
                <h3>Karya</h3>
                <div class="stat-number">89</div>
            </div>
            <div class="stat-icon"><svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></div>
        </div>
    </div>

    <div class="activity-section">
        <div class="section-title">Aktivitas Terbaru</div>
        <table>
            <thead>
                <tr>
                    <th>Aksi</th>
                    <th>Kategori</th>
                    <th>Waktu</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><strong>Menambahkan Anggota</strong> "Ahmad Fauzi"</td>
                    <td><span class="badge badge-anggota">Anggota</span></td>
                    <td style="color: var(--text-secondary);">Baru saja</td>
                </tr>
                <tr>
                    <td><strong>Menerbitkan Berita</strong> "Bakti Sosial 2026"</td>
                    <td><span class="badge badge-berita">Berita</span></td>
                    <td style="color: var(--text-secondary);">2 jam lalu</td>
                </tr>
                <tr>
                    <td><strong>Menyetujui Karya</strong> "Senja di Kota"</td>
                    <td><span class="badge badge-karya">Karya</span></td>
                    <td style="color: var(--text-secondary);">Kemarin</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
