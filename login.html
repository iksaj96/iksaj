<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - IKSAJ File Sharing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        :root {
            --bg-body: #0b0f17;
            --bg-surface: #111827;
            --border-subtle: #243049;
            --border-hover: #374151;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-primary: #f59e0b;
            --accent-hover: #d97706;
            --accent-soft: rgba(245, 158, 11, 0.1);
            --brand-blue: #2563eb;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        .split-container {
            display: flex;
            width: 100vw;
            min-height: 100vh;
        }

        /* Bagian Kiri: Video Background & Overlay */
        .left-pane {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2.5rem;
            overflow: hidden;
            background: #000;
        }

        .bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 1;
            transform: translate(-50%, -50%);
            object-fit: cover;
            opacity: 0.75;
        }

        /* Layer Overlay Tipis */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(11, 15, 23, 0.2) 0%, rgba(5, 7, 11, 0.5) 100%),
                        linear-gradient(135deg, rgba(11, 15, 23, 0.4) 0%, rgba(15, 23, 42, 0.3) 100%);
            z-index: 2;
        }

        /* Teks di Pojok Kiri Atas */
        .brand-header-top {
            position: absolute;
            top: 2.5rem;
            left: 2.5rem;
            z-index: 3;
            max-width: 420px;
        }

        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .brand-title-badge {
            background: var(--brand-blue);
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 1.4rem;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .brand-desc {
            font-size: 0.875rem;
            color: #e5e7eb;
            line-height: 1.5;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
        }

        /* Logo di Tengah Layar Kiri */
        .brand-logo-center {
            position: relative;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .brand-logo-large {
            height: 130px;
            width: auto;
            filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.6));
            transition: transform 0.3s ease;
        }

        .brand-logo-large:hover {
            transform: scale(1.03);
        }

        /* Bagian Kanan: Form Login (Lengkung di Kiri) */
        .right-pane {
            width: 500px;
            background: var(--bg-surface);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem 2.5rem;
            border-left: 1px solid var(--border-subtle);
            position: relative;
            z-index: 4;
            border-radius: 28px 0 0 28px; /* Lengkungan keren di bagian kiri */
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            margin-left: -20px; /* Menimpa sedikit bagian video agar lekukan terlihat menyatu */
        }

        .login-header {
            margin-bottom: 2rem;
        }

        .login-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-bottom: 1.25rem;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-body);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            transition: border-color 0.15s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-primary);
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
            font-size: 0.9rem;
            z-index: 2;
        }

        .form-control {
            background: transparent;
            border: none;
            padding: 0.75rem 0.85rem 0.75rem 2.4rem;
            color: var(--text-main);
            font-size: 0.875rem;
            outline: none;
            width: 100%;
        }

        /* Email Pupil Suffix */
        .email-field {
            padding-right: 0.2rem;
        }

        .email-suffix {
            padding: 0.75rem 0.85rem 0.75rem 0;
            color: var(--text-muted);
            font-size: 0.875rem;
            user-select: none;
            pointer-events: none;
            font-weight: 500;
        }

        .alert {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-bottom: 1.25rem;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--danger-color);
        }

        .btn-submit {
            background: var(--accent-primary);
            color: #0b0f17;
            padding: 0.8rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer-credit {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2rem;
        }

        /* Responsif untuk Layar Tablet/HP */
        @media (max-width: 900px) {
            .split-container {
                flex-direction: column;
            }
            .left-pane {
                min-height: 260px;
                padding: 1.5rem;
                flex: none;
            }
            .brand-header-top {
                top: 1.5rem;
                left: 1.5rem;
            }
            .brand-title {
                font-size: 1.4rem;
            }
            .brand-title-badge {
                font-size: 1rem;
            }
            .brand-desc {
                font-size: 0.75rem;
            }
            .brand-logo-large {
                height: 80px;
            }
            .right-pane {
                width: 100%;
                border-left: none;
                border-top: 1px solid var(--border-subtle);
                border-radius: 24px 24px 0 0; /* Lengkung atas saat di tampilan HP */
                margin-left: 0;
                margin-top: -20px;
                padding: 2rem 1.5rem;
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <div class="split-container">
        
        <!-- Sisi Kiri: Video & Branding -->
        <div class="left-pane">
            <video autoplay loop muted playsinline class="bg-video">
                <source src="video.mp4" type="video/mp4">
            </video>
            <div class="video-overlay"></div>
            
            <!-- Teks Pojok Kiri Atas -->
            <div class="brand-header-top">
                <h1 class="brand-title">IKSAJ <span class="brand-title-badge">SHARE</span></h1>
                <p class="brand-desc">Portal Berbagi Berkas &amp; Pengelolaan Dokumen Internal</p>
            </div>

            <!-- Logo Tengah Layar Kiri -->
            <div class="brand-logo-center">
                <img src="logo.png" alt="Logo IKSAJ" class="brand-logo-large">
            </div>
        </div>

        <!-- Sisi Kanan: Form Login -->
        <div class="right-pane">
            <div>
                <div class="login-header">
                    <h2>Selamat Datang</h2>
                    <p>Silakan masuk menggunakan akun internal Anda</p>
                </div>

                <div id="alertBox" class="alert alert-danger">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span id="alertMessage">Email atau kata sandi salah!</span>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="emailInput">Alamat Email</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-envelope"></i>
                            <input type="text" id="emailInput" class="form-control email-field" placeholder="username" autofocus required>
                            <span class="email-suffix">@iksaj.com</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="passwordInput">Kata Sandi</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" id="btnSubmit" class="btn-submit">
                        <i class="fa-solid fa-right-to-bracket"></i> Masuk
                    </button>
                </form>
            </div>

            <div class="footer-credit">
                &copy; 2026 IKSAJ Share. Platform Berbagi Dokumen Internal.
            </div>
        </div>

    </div>

    <script>
        const { createClient } = supabase;
        const supabaseClient = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const btnSubmit = document.getElementById('btnSubmit');
        const alertBox = document.getElementById('alertBox');
        const alertMessage = document.getElementById('alertMessage');

        // Pengecekan awal: Jika pengguna sudah login, alihkan ke halaman utama
        async function checkAlreadyLoggedIn() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = 'index.html';
            }
        }
        checkAlreadyLoggedIn();

        // Proses autentikasi Supabase saat form dikirim
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            alertBox.style.display = 'none';
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memverifikasi...`;

            // Menggabungkan input username pengguna dengan suffix domain permanen
            const rawUsername = emailInput.value.trim().replace(/@.*$/, ''); // Menghapus jika user tak sengaja ngetik @
            const fullEmail = rawUsername + '@iksaj.com';
            const password = passwordInput.value.trim();

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: fullEmail,
                password: password,
            });

            if (error) {
                alertMessage.textContent = error.message === 'Invalid login credentials' 
                    ? 'Email atau kata sandi tidak valid.' 
                    : error.message;
                alertBox.style.display = 'flex';
                
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Masuk`;
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
