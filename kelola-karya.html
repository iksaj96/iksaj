<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Karya - IKSAJ</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-app: #f2f2f7;
            --card-bg: #ffffff;
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --accent-yellow: #ffcc00;
            --danger-color: #ff3b30;
            --radius-main: 20px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-app);
            color: var(--text-primary);
            padding: 32px;
            margin: 0;
        }

        /* Header iOS */
        .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px; }
        .page-title h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }
        .page-title p { color: var(--text-secondary); margin-top: 4px; }

        .btn-add {
            background-color: #000;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: flex; align-items: center; gap: 8px;
            transition: transform 0.2s;
        }
        .btn-add:hover { transform: scale(1.02); }

        /* Search */
        .control-bar { margin-bottom: 32px; }
        .search-input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            border: none;
            background: #e5e5ea;
            font-size: 1rem;
            outline: none;
        }

        /* Grid Karya */
        .works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .work-card {
            background: var(--card-bg);
            border-radius: var(--radius-main);
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            display: flex; flex-direction: column;
        }

        .work-preview-container { height: 200px; position: relative; }
        .work-img { width: 100%; height: 100%; object-fit: cover; }

        .card-badges { position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 8px; }
        .badge {
            padding: 6px 12px; font-size: 0.7rem; font-weight: 700;
            border-radius: 8px; text-transform: uppercase;
        }
        .badge-publish { background: #dcfce7; color: #15803d; }
        .badge-draft { background: #fee2e2; color: #b91c1c; }
        .badge-type { background: rgba(0,0,0,0.6); color: #fff; backdrop-filter: blur(4px); }

        .work-details { padding: 20px; flex: 1; }
        .work-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
        .work-author { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 16px; }

        .card-actions { display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid #f2f2f7; padding-top: 16px; }
        .btn-action {
            padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 0.85rem;
            cursor: pointer; border: none;
        }
        .btn-edit { background: var(--accent-yellow); color: #000; }
        .btn-delete { background: #f0f0f0; color: var(--danger-color); }
    </style>
</head>
<body>

    <div class="page-header">
        <div class="page-title">
            <h1>Galeri Karya</h1>
            <p>Kelola portofolio kreatif anggota IKSAJ</p>
        </div>
        <button class="btn-add" id="btnTambah">Unggah Karya</button>
    </div>

    <div class="control-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Cari judul karya...">
    </div>

    <div class="works-grid" id="worksGrid">
        <div class="status-message">Memuat data...</div>
    </div>

    <script type="module">
        import { supabase } from './adlan_madjied_ridho/supa.js';
        const grid = document.getElementById('worksGrid');

        async function fetchKarya() {
            const keyword = document.getElementById('searchInput').value;
            let query = supabase.from('karya').select('id, judul, tipe_karya, status, gambar_url, anggota:anggota_id(nama)');
            if (keyword) query = query.ilike('judul', `%${keyword}%`);
            
            const { data } = await query.order('created_at', { ascending: false });

            if (!data || data.length === 0) {
                grid.innerHTML = '<div class="status-message">Tidak ada karya ditemukan.</div>';
                return;
            }

            grid.innerHTML = data.map(k => `
                <div class="work-card" id="card-${k.id}">
                    <div class="work-preview-container">
                        <img src="${k.gambar_url || 'https://via.placeholder.com/400'}" class="work-img">
                        <div class="card-badges">
                            <span class="badge ${k.status === 'Draf' ? 'badge-draft' : 'badge-publish'}">${k.status || 'Publik'}</span>
                            <span class="badge badge-type">${k.tipe_karya || 'Umum'}</span>
                        </div>
                    </div>
                    <div class="work-details">
                        <div class="work-title">${k.judul || 'Tanpa Judul'}</div>
                        <div class="work-author">Oleh: ${k.anggota?.nama || 'Tanpa Nama'}</div>
                        <div class="card-actions">
                            <button class="btn-action btn-edit" onclick="location.href='form/form-karya.html?id=${k.id}'">Edit</button>
                            <button class="btn-action btn-delete" onclick="hapusKarya('${k.id}')">Hapus</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.hapusKarya = async (id) => {
            if (confirm('Yakin ingin menghapus karya ini?')) {
                await supabase.from('karya').delete().eq('id', id);
                fetchKarya();
            }
        };

        document.getElementById('btnTambah').onclick = () => location.href = 'form/form-karya.html';
        document.getElementById('searchInput').addEventListener('input', fetchKarya);
        fetchKarya();
    </script>
</body>
</html>
