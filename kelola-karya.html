<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Karya - IKSAJ</title>
    <link rel="icon" type="image/png" href="image/logo/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg-content: #f8fafc;
            --white-pure: #ffffff;
            --navy-dark: #0f172a;
            --text-main: #334155;
            --text-muted: #64748b;
            --yellow-solid: #ffcc00;
            --yellow-hover: #e6b800;
            --border-color: rgba(0, 0, 0, 0.06);
            --success-color: #16a34a;
            --warning-color: #ea580c;
            --danger-color: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-content);
            color: var(--text-main);
            padding: 24px;
            line-height: 1.5;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }
        .page-title h1 {
            color: var(--navy-dark);
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .page-title p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 2px;
        }
        .btn-add {
            background-color: var(--navy-dark);
            color: var(--white-pure);
            border: none;
            padding: 10px 20px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
        }
        .btn-add:hover {
            opacity: 0.9;
        }
        .control-bar {
            background-color: var(--white-pure);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .search-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            color: var(--text-main);
        }
        .search-input:focus {
            border-color: var(--navy-dark);
        }
        .works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }
        .work-card {
            background-color: var(--white-pure);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .work-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.04);
        }
        .work-preview-container {
            position: relative;
            width: 100%;
            height: 220px;
            background-color: #cbd5e1;
        }
        .work-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-badges {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .badge {
            padding: 4px 8px;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: fit-content;
        }
        .badge-publish { background-color: var(--success-color); color: var(--white-pure); }
        .badge-draft { background-color: var(--text-muted); color: var(--white-pure); }
        .badge-type { background-color: rgba(15, 23, 42, 0.85); color: var(--white-pure); backdrop-filter: blur(4px); }
        .work-details {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .work-title {
            color: var(--navy-dark);
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 4px;
        }
        .work-author {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-bottom: 12px;
        }
        .work-author span {
            color: var(--navy-dark);
            font-weight: 700;
        }
        .card-actions {
            margin-top: auto;
            padding-top: 14px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .right-actions {
            display: flex;
            gap: 6px;
            width: 100%;
            justify-content: flex-end;
        }
        .btn-action {
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-edit {
            background-color: var(--yellow-solid);
            color: var(--navy-dark);
        }
        .btn-edit:hover {
            background-color: var(--yellow-hover);
        }
        .btn-delete {
            background-color: transparent;
            border-color: #cbd5e1;
            color: var(--danger-color);
        }
        .btn-delete:hover {
            background-color: #fee2e2;
            border-color: #fca5a5;
        }
        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1rem;
            background: var(--white-pure);
            border: 1px dashed #cbd5e1;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="page-header">
        <div class="page-title">
            <h1>Galeri & Manajemen Karya</h1>
            <p>Moderasi, klasifikasi, dan kelola portofolio karya seni kreatif langsung dari database.</p>
        </div>
        <button class="btn-add" id="btnTambah">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Unggah Karya
        </button>
    </div>

    <div class="control-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Cari berdasarkan judul karya...">
    </div>

    <div class="works-grid" id="worksGrid">
        <div class="status-message">Memuat data karya dari Supabase...</div>
    </div>

    <script type="module">
        import { supabase } from './adlan_madjied_ridho/supa.js';

        async function fetchKarya() {
            const grid = document.getElementById('worksGrid');
            const keyword = document.getElementById('searchInput').value;

            try {
                // Mengambil data karya sekaligus 'nama' dari relasi anggota_id
                let query = supabase
                    .from('karya')
                    .select('id, judul, tipe_karya, status, gambar_url, created_at, anggota:anggota_id(nama)');

                if (keyword) {
                    query = query.ilike('judul', `%${keyword}%`);
                }

                const { data, error } = await query.order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="status-message">Tidak ada karya ditemukan.</div>';
                    return;
                }

                grid.innerHTML = '';

                data.forEach(karya => {
                    const statusBadgeClass = karya.status && karya.status.toLowerCase() === 'draf' ? 'badge-draft' : 'badge-publish';
                    const coverImg = karya.gambar_url || 'https://via.placeholder.com/400x220?text=No+Image';
                    
                    // Mengambil nama relasi dengan aman jika anggota_id terhubung dengan benar
                    const penulis = karya.anggota && karya.anggota.nama ? karya.anggota.nama : 'Tanpa Nama';

                    const cardHTML = `
                        <div class="work-card" id="card-${karya.id}">
                            <div class="work-preview-container">
                                <img src="${coverImg}" alt="${karya.judul || 'Karya'}" class="work-img" onerror="this.src='https://via.placeholder.com/400x220?text=Error+Image'">
                                <div class="card-badges">
                                    <span class="badge ${statusBadgeClass}">${karya.status || 'Publik'}</span>
                                    <span class="badge badge-type">${karya.tipe_karya || 'Umum'}</span>
                                </div>
                            </div>
                            <div class="work-details">
                                <h2 class="work-title">${karya.judul || 'Tanpa Judul'}</h2>
                                <div class="work-author">Oleh: <span>${penulis}</span></div>
                                <div class="card-actions">
                                    <div class="right-actions">
                                        <button class="btn-action btn-edit" data-id="${karya.id}">Edit</button>
                                        <button class="btn-action btn-delete" data-id="${karya.id}">Hapus</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    grid.insertAdjacentHTML('beforeend', cardHTML);
                });

                document.querySelectorAll('.btn-edit').forEach(btn => {
                    btn.addEventListener('click', (e) => editKarya(e.target.dataset.id));
                });

                document.querySelectorAll('.btn-delete').forEach(btn => {
                    btn.addEventListener('click', (e) => hapusKarya(e.target.dataset.id));
                });

            } catch (err) {
                console.error(err);
                grid.innerHTML = `<div class="status-message" style="color:var(--danger-color)">Gagal memuat data: ${err.message}</div>`;
            }
        }

        async function hapusKarya(id) {
            if (confirm('Apakah Anda yakin ingin menghapus karya ini secara permanen dari database?')) {
                try {
                    const { error } = await supabase
                        .from('karya')
                        .delete()
                        .eq('id', id);

                    if (error) throw error;

                    const targetCard = document.getElementById(`card-${id}`);
                    if (targetCard) targetCard.remove();
                    alert('Karya berhasil dihapus!');
                } catch (err) {
                    alert('Gagal menghapus data: ' + err.message);
                }
            }
        }

        function editKarya(id) {
            window.location.href = `form/form-karya.html?id=${id}`;
        }

        function tambahKarya() {
            window.location.href = 'form/form-karya.html';
        }

        document.getElementById('searchInput').addEventListener('input', fetchKarya);
        document.getElementById('btnTambah').addEventListener('click', tambahKarya);

        fetchKarya();
    </script>
</body>
</html>
