<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Berita - IKSAJ</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-app: #f2f2f7;
            --card-bg: #ffffff;
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --accent-yellow: #ffcc00;
            --radius-main: 20px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-app);
            color: var(--text-primary);
            padding: 32px;
            margin: 0;
        }

        /* Header iOS */
        .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px; }
        .page-title h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }
        .page-title p { color: var(--text-secondary); margin-top: 4px; }

        .btn-add {
            background-color: #000;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            display: flex; align-items: center; gap: 8px;
            transition: transform 0.2s;
        }
        .btn-add:hover { transform: scale(1.02); }

        /* Search Bar */
        .search-bar { margin-bottom: 32px; }
        .search-input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            border: none;
            background: #e5e5ea;
            font-size: 1rem;
            outline: none;
        }

        /* Grid Berita */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .news-card {
            background: var(--card-bg);
            border-radius: var(--radius-main);
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            display: flex; flex-direction: column;
        }

        .news-cover-container { height: 180px; position: relative; }
        .news-cover { width: 100%; height: 100%; object-fit: cover; }

        .card-badges { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; }
        .badge {
            padding: 6px 12px; font-size: 0.7rem; font-weight: 700;
            border-radius: 8px; text-transform: uppercase;
        }
        .badge-status-publish { background: #dcfce7; color: #15803d; }
        .badge-status-draft { background: #fee2e2; color: #b91c1c; }
        .badge-category { background: rgba(0,0,0,0.6); color: #fff; backdrop-filter: blur(4px); }

        .news-content { padding: 20px; flex: 1; }
        .news-meta { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 8px; }
        .news-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; line-height: 1.3; }

        .card-actions { display: flex; gap: 8px; }
        .btn-action {
            padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 0.85rem;
            cursor: pointer; border: none; text-decoration: none;
        }
        .btn-edit { background: var(--accent-yellow); color: #000; }
        .btn-delete { background: #f0f0f0; color: #ff3b30; }
    </style>
</head>
<body>

    <div class="page-header">
        <div class="page-title">
            <h1>Berita</h1>
            <p>Kelola artikel dan publikasi IKSAJ</p>
        </div>
        <a href="form/form-berita.html" class="btn-add">Tambah Berita</a>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Cari judul berita...">
    </div>

    <div id="newsGrid" class="news-grid">
        <div class="loading-text" style="grid-column: 1/-1;">Memuat data...</div>
    </div>

    <script type="module">
        import { supabase } from './adlan_madjied_ridho/supa.js';
        const newsGrid = document.getElementById('newsGrid');

        async function fetchBerita(keyword = '') {
            let query = supabase.from('berita').select('*').order('created_at', { ascending: false });
            if (keyword) query = query.or(`judul.ilike.%${keyword}%,kategori.ilike.%${keyword}%`);
            
            const { data } = await query;
            newsGrid.innerHTML = data.map(b => `
                <div class="news-card">
                    <div class="news-cover-container">
                        <img src="${b.gambar_url || 'https://via.placeholder.com/400'}" class="news-cover">
                        <div class="card-badges">
                            <span class="badge ${b.status === 'Terbit' ? 'badge-status-publish' : 'badge-status-draft'}">${b.status || 'Draf'}</span>
                            <span class="badge badge-category">${b.kategori || 'Umum'}</span>
                        </div>
                    </div>
                    <div class="news-content">
                        <div class="news-meta">${new Date(b.created_at).toLocaleDateString()} • ${b.penulis || 'Admin'}</div>
                        <div class="news-title">${b.judul}</div>
                        <div class="card-actions">
                            <a href="form/form-berita.html?id=${b.id}" class="btn-action btn-edit">Edit</a>
                            <button class="btn-action btn-delete" onclick="deleteBerita('${b.id}')">Hapus</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.deleteBerita = async (id) => {
            if (confirm('Yakin ingin menghapus berita ini?')) {
                await supabase.from('berita').delete().eq('id', id);
                fetchBerita();
            }
        };

        document.getElementById('searchInput').addEventListener('input', (e) => fetchBerita(e.target.value));
        fetchBerita();
    </script>
</body>
</html>
