<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eksplor Berita - IKSAJ</title>
    <link rel="icon" type="image/png" href="/image/logo/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* Base Reset & Variables */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg-cool-white: #f4f7f6; --yellow-solid: #ffcc00; --navy-dark: #0f172a; --text-main: #334155; --white-pure: #ffffff; --border-color: #e2e8f0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-cool-white); color: var(--text-main); line-height: 1.6; }

        /* GLASSMORPHISM HEADER (Identik Index) */
        header { background-color: rgba(255, 204, 0, 0.4); backdrop-filter: blur(16px); position: fixed; top: 12px; left: 4%; right: 4%; width: 92%; z-index: 1000; border: 1px solid rgba(255, 255, 255, 0.3); padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; border-radius: 10px; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease; }
        header.scroll-down { transform: translateY(-150%); opacity: 0; }
        header.scroll-up { transform: translateY(0); opacity: 1; background-color: rgba(255, 204, 0, 0.5); }

        .header-left { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .header-logo { height: 32px; width: auto; object-fit: contain; }
        .brand-info { display: flex; flex-direction: column; }
        .brand-title { font-size: 1rem; font-weight: 800; color: var(--navy-dark); line-height: 1.1; }
        .brand-subtitle { font-size: 0.65rem; color: #475569; font-weight: 600; }
        .secret-gate { text-decoration: none; color: inherit; cursor: default; }

        .menu-toggle { display: flex; flex-direction: column; gap: 4px; background: none; border: none; cursor: pointer; padding: 4px; z-index: 1001; }
        .menu-toggle span { display: block; width: 22px; height: 2px; background-color: var(--navy-dark); transition: all 0.3s ease; }

        nav { position: absolute; top: 100%; left: 0; right: 0; background-color: rgba(255, 215, 0, 0.95); backdrop-filter: blur(20px); margin-top: 8px; border-radius: 10px; padding: 15px; opacity: 0; visibility: hidden; transform: translateY(-10px); transition: all 0.3s ease; }
        nav.open { opacity: 1; visibility: visible; transform: translateY(0); }
        nav ul { display: flex; flex-direction: column; list-style: none; gap: 12px; text-align: center; }
        nav ul li a { text-decoration: none; color: var(--navy-dark); font-weight: 700; display: block; }

        /* HERO SECTION (Background Putih) */
        .explore-hero { background-color: var(--white-pure); padding: 140px 5% 60px 5%; text-align: center; border-bottom: 1px solid var(--border-color); }
        .explore-hero h1 { font-size: 2.2rem; font-weight: 800; color: var(--navy-dark); margin-bottom: 10px; }
        .explore-hero p { color: #64748b; font-size: 1rem; max-width: 600px; margin: 0 auto; }

        /* MAIN CONTAINER */
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 5%; }
        .search-filter-zone { display: flex; flex-direction: column; gap: 15px; margin-bottom: 40px; }
        .search-box { width: 100%; padding: 14px 20px; font-size: 1rem; border: 2px solid var(--border-color); outline: none; background-color: var(--white-pure); transition: border-color 0.2s ease; }
        .tag-btn { background-color: var(--white-pure); border: 1px solid var(--border-color); padding: 8px 16px; cursor: pointer; font-weight: 600; }
        .tag-btn.active { background-color: var(--navy-dark); color: var(--white-pure); }

        /* GRID BERITA */
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .card-link { text-decoration: none; color: inherit; display: block; }
        .card { background-color: var(--white-pure); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); height: 100%; display: flex; flex-direction: column; border-bottom: 3px solid transparent; transition: 0.2s; }
        .card:hover { transform: translateY(-4px); border-bottom: 3px solid var(--yellow-solid); }
        .card-banner { height: 180px; background: #e2e8f0; overflow: hidden; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 20px; flex-grow: 1; }
        .status-msg { text-align: center; color: #64748b; padding: 40px; grid-column: 1 / -1; }
        #infinite-anchor { text-align: center; padding: 30px 0; font-weight: 600; color: #64748b; }

        @media (min-width: 769px) {
            header { padding: 10px 30px; top: 20px; left: 5%; right: 5%; width: 90%; }
            .menu-toggle { display: none; }
            nav { position: static; opacity: 1; visibility: visible; transform: none; background: none; padding: 0; display: block; }
            nav ul { flex-direction: row; gap: 25px; }
            .search-filter-zone { flex-direction: row; }
            .search-box { width: 350px; }
        }
    </style>
</head>
<body>

    <header id="smart-header">
        <div class="header-left" onclick="window.location.href='/index.html'">
            <img src="/image/logo/logo.png" alt="Logo IKSAJ" class="header-logo">
            <div class="brand-info">
                <span class="brand-title">IKSAJ</span>
                <span class="brand-subtitle">Ikatan Santri Annuqayah <a href="/admin.html" class="secret-gate">Jawa</a></span>
            </div>
        </div>
        <button class="menu-toggle" id="menu-btn" aria-label="Buka Menu"><span></span><span></span><span></span></button>
        <nav id="nav-menu">
            <ul>
                <li><a href="/komponen_index/eksplor-berita.html">Eksplor Berita</a></li>
                <li><a href="/komponen_index/eksplor-karya.html">Eksplor Karya</a></li>
            </ul>
        </nav>
    </header>

    <section class="explore-hero">
        <h1>Eksplor Berita</h1>
        <p>Arsip kabar, informasi resmi, dan rangkuman kegiatan rutin seputar Ikatan Santri Annuqayah Jawa.</p>
    </section>

    <div class="container">
        <div class="search-filter-zone">
            <input type="text" id="search-input" class="search-box" placeholder="Cari judul berita...">
            <div class="filter-tags" id="filter-tags-container">
                <button class="tag-btn active" data-kategori="semua">Semua</button>
            </div>
        </div>
        <div class="grid-3" id="berita-explore-container"></div>
        <div id="infinite-anchor">Memeriksa data baru...</div>
    </div>

    <script type="module">
        import { supabase } from '/adlan_madjied_ridho/supa.js';
        const ITEMS_PER_PAGE = 6;
        let currentPage = 0;
        let isThrottled = false;
        let hasMoreData = true;
        let currentKategori = 'semua';
        let searchQuery = '';

        const container = document.getElementById('berita-explore-container');
        const searchInput = document.getElementById('search-input');
        const tagsContainer = document.getElementById('filter-tags-container');
        const anchor = document.getElementById('infinite-anchor');

        // Fungsi Header
        const menuBtn = document.getElementById('menu-btn');
        const navMenu = document.getElementById('nav-menu');
        menuBtn.addEventListener('click', () => { navMenu.classList.toggle('open'); });

        let lastScrollTop = 0;
        const header = document.getElementById('smart-header');
        window.addEventListener('scroll', () => {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (navMenu.classList.contains('open')) return;
            if (scrollTop > lastScrollTop && scrollTop > 100) { header.classList.remove('scroll-up'); header.classList.add('scroll-down'); } 
            else { header.classList.remove('scroll-down'); header.classList.add('scroll-up'); }
            lastScrollTop = scrollTop;
        });

        // Logika Berita
        async function loadCategories() {
            const { data, error } = await supabase.from('berita').select('kategori').or('status.eq.Publik,status.eq.publik');
            if (!error && data) {
                const kategoriSet = new Set(data.map(item => item.kategori).filter(Boolean));
                kategoriSet.forEach(kat => {
                    const btn = document.createElement('button');
                    btn.className = 'tag-btn';
                    btn.textContent = kat;
                    btn.setAttribute('data-kategori', kat);
                    tagsContainer.appendChild(btn);
                });
                setupFilterEvents();
            }
        }

        async function fetchBerita(reset = false) {
            if (reset) { currentPage = 0; hasMoreData = true; container.innerHTML = '<div class="status-msg">Memuat data...</div>'; anchor.style.display = 'block'; }
            if (!hasMoreData || isThrottled) return;
            isThrottled = true;
            const from = currentPage * ITEMS_PER_PAGE;
            const to = from + ITEMS_PER_PAGE - 1;
            let query = supabase.from('berita').select('id, judul, slug, ringkasan, kategori, status, gambar_url, created_at').or('status.eq.Publik,status.eq.publik').order('created_at', { ascending: false }).range(from, to);
            if (currentKategori !== 'semua') query = query.eq('kategori', currentKategori);
            if (searchQuery.trim() !== '') query = query.ilike('judul', `%${searchQuery}%`);
            const { data: beritaList, error } = await query;
            if (reset) container.innerHTML = '';
            if (error) { container.innerHTML = `<div class="status-msg">Gagal memuat data.</div>`; anchor.style.display = 'none'; isThrottled = false; return; }
            if (!beritaList || beritaList.length === 0) { if (reset) container.innerHTML = `<div class="status-msg">Tidak ada berita ditemukan.</div>`; hasMoreData = false; anchor.style.display = 'none'; isThrottled = false; return; }
            beritaList.forEach(item => {
                const coverImage = item.gambar_url || '/image/logo/logo.png';
                container.insertAdjacentHTML('beforeend', `
                    <a href="/detail/berita.html?slug=${item.slug}" class="card-link">
                        <div class="card">
                            <div class="card-banner"><img src="${coverImage}" alt="${item.judul}" class="card-img" loading="lazy"></div>
                            <div class="card-content">
                                <h3 style="font-size: 1.1rem; margin-bottom: 8px;">${item.judul}</h3>
                                <p style="font-size: 0.9rem; color: #64748b;">${item.ringkasan || ''}</p>
                            </div>
                        </div>
                    </a>`);
            });
            if (beritaList.length < ITEMS_PER_PAGE) { hasMoreData = false; anchor.style.display = 'none'; } else { currentPage++; }
            isThrottled = false;
        }

        function setupFilterEvents() {
            const buttons = document.querySelectorAll('.tag-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    buttons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentKategori = this.getAttribute('data-kategori');
                    fetchBerita(true);
                });
            });
        }

        searchInput.addEventListener('input', function() {
            clearTimeout(window.searchTimeout);
            searchQuery = this.value;
            window.searchTimeout = setTimeout(() => { fetchBerita(true); }, 400);
        });

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && hasMoreData && !isThrottled) fetchBerita();
        }, { rootMargin: '150px' });
        observer.observe(anchor);

        loadCategories();
        fetchBerita(true);
    </script>
</body>
</html>
