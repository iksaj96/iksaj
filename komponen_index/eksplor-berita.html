<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eksplor Berita - IKSAJ</title>
    <link rel="icon" type="image/png" href="/image/logo/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
    /* 1. Base Reset & Variables */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { 
        --bg-cool-white: #f4f7f6; 
        --maroon-dark: #4a0404; 
        --gold-main: #ffcc00; 
        --navy-dark: #0f172a; 
        --text-main: #334155; 
        --white-pure: #ffffff; 
        --border-color: #e2e8f0; 
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-cool-white); color: var(--text-main); line-height: 1.6; }

    /* 2. Header (Sesuai Desain Baru) */
    header { 
        background-color: var(--maroon-dark); 
        width: 100%; 
        border-bottom: 3px solid var(--gold-main); 
        padding: 15px 20px; 
        display: flex; 
        align-items: center; 
        justify-content: space-between; 
        color: var(--white-pure);
        position: relative;
    }
    .header-left { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .header-logo { height: 35px; width: auto; }
    .brand-title { font-size: 1.1rem; font-weight: 800; color: var(--gold-main); }
    .brand-subtitle { font-size: 0.7rem; color: #e2e8f0; text-transform: uppercase; }
    .secret-gate { text-decoration: none; color: rgba(255, 255, 255, 0.3); }

    /* 3. Menu Mobile */
    .menu-toggle { display: flex; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; }
    .menu-toggle span { display: block; width: 25px; height: 3px; background-color: var(--gold-main); border-radius: 2px; }
    
    nav { position: absolute; top: 100%; left: 0; right: 0; background-color: var(--maroon-dark); padding: 20px; opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 1000; border-bottom: 2px solid var(--gold-main); }
    nav.open { opacity: 1; visibility: visible; }
    nav ul { list-style: none; display: flex; flex-direction: column; gap: 15px; text-align: center; }
    nav ul li a { text-decoration: none; color: var(--white-pure); font-weight: 600; }

    /* 4. Explore Hero */
    .explore-hero { background-color: var(--white-pure); padding: 60px 5%; text-align: center; border-bottom: 1px solid var(--border-color); }
    .explore-hero h1 { font-size: 2rem; color: var(--navy-dark); margin-bottom: 10px; }

    /* 5. Search & Filter */
    .container { max-width: 1100px; margin: 0 auto; padding: 40px 5%; }
    .search-filter-zone { display: flex; flex-direction: column; gap: 15px; margin-bottom: 40px; }
    .search-box { width: 100%; padding: 12px 20px; border: 2px solid var(--border-color); border-radius: 8px; outline: none; transition: 0.3s; }
    .search-box:focus { border-color: var(--gold-main); }
    
    .filter-tags { display: flex; gap: 10px; flex-wrap: wrap; }
    .tag-btn { background: var(--white-pure); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: 0.3s; font-size: 0.9rem; }
    .tag-btn.active { background-color: var(--maroon-dark); color: var(--white-pure); border-color: var(--maroon-dark); }

    /* 6. Grid Berita */
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
    .card-link { text-decoration: none; color: inherit; }
    .card { background: var(--white-pure); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; height: 100%; border: 1px solid var(--border-color); }
    .card:hover { transform: translateY(-8px); border-color: var(--gold-main); }
    .card-banner { height: 190px; background: #ddd; }
    .card-img { width: 100%; height: 100%; object-fit: cover; }
    .card-content { padding: 20px; }

    /* 7. Responsive Desktop */
    @media (min-width: 769px) {
        header { padding: 15px 80px; }
        .menu-toggle { display: none; }
        nav { position: static; opacity: 1; visibility: visible; padding: 0; background: transparent; border: none; }
        nav ul { flex-direction: row; gap: 30px; }
        .search-filter-zone { flex-direction: row; align-items: center; }
        .search-box { width: 400px; }
    }
</style>

</head>
<body>

    <header id="smart-header">
        <div class="header-left" onclick="window.location.href='/index.html'">
            <img src="/image/logo/logo.png" alt="Logo IKSAJ" class="header-logo">
            <div class="brand-info">
                <span class="brand-title">IKSAJ</span>
                <span class="brand-subtitle">Ikatan Santri Annuqayah <a href="/admin.html" class="secret-gate">Jawa</a></span>
            </div>
        </div>
        <button class="menu-toggle" id="menu-btn" aria-label="Buka Menu"><span></span><span></span><span></span></button>
        <nav id="nav-menu">
            <ul>
                <li><a href="/komponen_index/eksplor-berita.html">Eksplor Berita</a></li>
                <li><a href="/komponen_index/eksplor-karya.html">Eksplor Karya</a></li>
            </ul>
        </nav>
    </header>

    <section class="explore-hero">
        <h1>Eksplor Berita</h1>
        <p>Arsip kabar, informasi resmi, dan rangkuman kegiatan rutin seputar Ikatan Santri Annuqayah Jawa.</p>
    </section>

    <div class="container">
        <div class="search-filter-zone">
            <input type="text" id="search-input" class="search-box" placeholder="Cari judul berita...">
            <div class="filter-tags" id="filter-tags-container">
                <button class="tag-btn active" data-kategori="semua">Semua</button>
            </div>
        </div>
        <div class="grid-3" id="berita-explore-container"></div>
        <div id="infinite-anchor">Memeriksa data baru...</div>
    </div>

    <script type="module">
        import { supabase } from '/adlan_madjied_ridho/supa.js';
        const ITEMS_PER_PAGE = 6;
        let currentPage = 0;
        let isThrottled = false;
        let hasMoreData = true;
        let currentKategori = 'semua';
        let searchQuery = '';

        const container = document.getElementById('berita-explore-container');
        const searchInput = document.getElementById('search-input');
        const tagsContainer = document.getElementById('filter-tags-container');
        const anchor = document.getElementById('infinite-anchor');

        // Fungsi Header
        const menuBtn = document.getElementById('menu-btn');
        const navMenu = document.getElementById('nav-menu');
        menuBtn.addEventListener('click', () => { navMenu.classList.toggle('open'); });

        let lastScrollTop = 0;
        const header = document.getElementById('smart-header');
        window.addEventListener('scroll', () => {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (navMenu.classList.contains('open')) return;
            if (scrollTop > lastScrollTop && scrollTop > 100) { header.classList.remove('scroll-up'); header.classList.add('scroll-down'); } 
            else { header.classList.remove('scroll-down'); header.classList.add('scroll-up'); }
            lastScrollTop = scrollTop;
        });

        // Logika Berita
        async function loadCategories() {
            const { data, error } = await supabase.from('berita').select('kategori').or('status.eq.Publik,status.eq.publik');
            if (!error && data) {
                const kategoriSet = new Set(data.map(item => item.kategori).filter(Boolean));
                kategoriSet.forEach(kat => {
                    const btn = document.createElement('button');
                    btn.className = 'tag-btn';
                    btn.textContent = kat;
                    btn.setAttribute('data-kategori', kat);
                    tagsContainer.appendChild(btn);
                });
                setupFilterEvents();
            }
        }

        async function fetchBerita(reset = false) {
            if (reset) { currentPage = 0; hasMoreData = true; container.innerHTML = '<div class="status-msg">Memuat data...</div>'; anchor.style.display = 'block'; }
            if (!hasMoreData || isThrottled) return;
            isThrottled = true;
            const from = currentPage * ITEMS_PER_PAGE;
            const to = from + ITEMS_PER_PAGE - 1;
            let query = supabase.from('berita').select('id, judul, slug, ringkasan, kategori, status, gambar_url, created_at').or('status.eq.Publik,status.eq.publik').order('created_at', { ascending: false }).range(from, to);
            if (currentKategori !== 'semua') query = query.eq('kategori', currentKategori);
            if (searchQuery.trim() !== '') query = query.ilike('judul', `%${searchQuery}%`);
            const { data: beritaList, error } = await query;
            if (reset) container.innerHTML = '';
            if (error) { container.innerHTML = `<div class="status-msg">Gagal memuat data.</div>`; anchor.style.display = 'none'; isThrottled = false; return; }
            if (!beritaList || beritaList.length === 0) { if (reset) container.innerHTML = `<div class="status-msg">Tidak ada berita ditemukan.</div>`; hasMoreData = false; anchor.style.display = 'none'; isThrottled = false; return; }
            beritaList.forEach(item => {
                const coverImage = item.gambar_url || '/image/logo/logo.png';
                container.insertAdjacentHTML('beforeend', `
                    <a href="/detail/berita.html?slug=${item.slug}" class="card-link">
                        <div class="card">
                            <div class="card-banner"><img src="${coverImage}" alt="${item.judul}" class="card-img" loading="lazy"></div>
                            <div class="card-content">
                                <h3 style="font-size: 1.1rem; margin-bottom: 8px;">${item.judul}</h3>
                                <p style="font-size: 0.9rem; color: #64748b;">${item.ringkasan || ''}</p>
                            </div>
                        </div>
                    </a>`);
            });
            if (beritaList.length < ITEMS_PER_PAGE) { hasMoreData = false; anchor.style.display = 'none'; } else { currentPage++; }
            isThrottled = false;
        }

        function setupFilterEvents() {
            const buttons = document.querySelectorAll('.tag-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    buttons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentKategori = this.getAttribute('data-kategori');
                    fetchBerita(true);
                });
            });
        }

        searchInput.addEventListener('input', function() {
            clearTimeout(window.searchTimeout);
            searchQuery = this.value;
            window.searchTimeout = setTimeout(() => { fetchBerita(true); }, 400);
        });

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && hasMoreData && !isThrottled) fetchBerita();
        }, { rootMargin: '150px' });
        observer.observe(anchor);

        loadCategories();
        fetchBerita(true);
    </script>
</body>
</html>
