<style>
    /* Reset & iOS Font */
    #smart-header *, #smart-header *::before, #smart-header *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    #smart-header { 
        /* Warna marun gelap senada dengan kain di hero */
        background-color: #4a0404; 
        position: relative; 
        width: 100%; 
        /* Border bawah warna emas tipis untuk memberikan kesan premium */
        border-bottom: 3px solid #ffcc00; 
        padding: 15px 20px; 
        display: flex; 
        align-items: center; 
        justify-content: space-between; 
        color: #ffffff;
    }

    .header-left { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .header-logo { height: 40px; width: auto; object-fit: contain; }
    
    .brand-info { display: flex; flex-direction: column; }
    .brand-title { font-size: 1.1rem; font-weight: 800; color: #ffcc00; line-height: 1.1; letter-spacing: 0.5px; }
    .brand-subtitle { font-size: 0.7rem; color: #e2e8f0; font-weight: 500; text-transform: uppercase; }
    
    .secret-gate { text-decoration: none; color: rgba(255, 255, 255, 0.3); cursor: default; }

    /* Menu Toggle (Warna Emas agar kontras dengan latar marun) */
    .menu-toggle { display: flex; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 4px; }
    .menu-toggle span { display: block; width: 25px; height: 3px; background-color: #ffcc00; border-radius: 2px; }

    /* Navigasi Mobile */
    #nav-menu { 
        position: absolute; 
        top: 100%; 
        left: 0; 
        right: 0; 
        background: #4a0404; 
        padding: 20px; 
        opacity: 0; 
        visibility: hidden; 
        transition: all 0.3s ease; 
        z-index: 1000; 
        border-bottom: 2px solid #ffcc00;
    }
    #nav-menu.open { opacity: 1; visibility: visible; }
    #nav-menu ul { display: flex; flex-direction: column; list-style: none; gap: 20px; text-align: center; }
    #nav-menu ul li a { text-decoration: none; color: #ffffff; font-weight: 600; font-size: 1rem; transition: color 0.3s; }
    #nav-menu ul li a:hover { color: #ffcc00; }

    /* Desktop View */
    @media (min-width: 769px) {
        #smart-header { padding: 15px 80px; }
        .menu-toggle { display: none; }
        #nav-menu { position: static; opacity: 1; visibility: visible; padding: 0; background: transparent; display: block; border: none; }
        #nav-menu ul { flex-direction: row; gap: 40px; }
    }
</style>

<header id="smart-header">
    <div class="header-left" onclick="window.location.href='index.html'">
        <img src="image/logo/logo.png" alt="Logo IKSAJ" class="header-logo">
        <div class="brand-info">
            <span class="brand-title">IKSAJ</span>
            <span class="brand-subtitle">Ikatan Santri Annuqayah <a href="/admin.html" class="secret-gate">Jawa</a></span>
        </div>
    </div>
    
    <button class="menu-toggle" id="menu-btn" aria-label="Buka Menu">
        <span></span><span></span><span></span>
    </button>

    <nav id="nav-menu">
        <ul>
            <li><a href="/komponen_index/eksplor-berita.html">Eksplor Berita</a></li>
            <li><a href="/komponen_index/eksplor-karya.html">Eksplor Karya</a></li>
        </ul>
    </nav>
</header>
