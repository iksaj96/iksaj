<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Reset & Base */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --yellow-solid: #ffcc00; --navy-dark: #0f172a; --text-light: #94a3b8; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--navy-dark); color: var(--text-light); }

        /* Footer Style */
        footer { padding: 40px 5% 20px 5%; border-top: 4px solid var(--yellow-solid); }
        .footer-content { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 20px; padding-bottom: 20px; border-bottom: 1px solid #334155; }
        
        .footer-brand { display: flex; align-items: center; }
        .footer-brand img { height: 40px; width: auto; }
        .footer-brand strong { color: #fff; margin-left: 12px; font-size: 1.2rem; }
        
        .footer-links { display: flex; gap: 20px; font-size: 0.9rem; font-weight: 600; }
        .footer-links a { color: #fff; text-decoration: none; }
        .footer-links a:hover { color: var(--yellow-solid); }

        .footer-bottom { text-align: center; padding-top: 20px; font-size: 0.75rem; }

        @media (min-width: 769px) {
            .footer-content { flex-direction: row; justify-content: space-between; }
        }
    </style>
</head>
<body>

    <footer>
        <div class="footer-content">
            <div class="footer-brand">
                <img src="../image/logo/logo.png" alt="IKSAJ Logo">
                <strong>IKSAJ</strong>
            </div>
            <div class="footer-links">
                <a href="../index.html">Beranda</a>
                <a href="../eksplor-berita.html">Eksplor Berita</a>
                <a href="../eksplor-karya.html">Eksplor Karya</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Ikatan Santri Annuqayah Jawa. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        // Mengirim tinggi konten ke parent agar iframe menyesuaikan secara otomatis
        function sendHeight() {
            const height = document.body.scrollHeight;
            window.parent.postMessage({ type: 'resize-iframe', height: height }, '*');
        }
        
        window.addEventListener('load', sendHeight);
        window.addEventListener('resize', sendHeight);
    </script>
</body>
</html>
