<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Karya - IKSAJ</title>
    <link rel="icon" type="image/png" href="/image/logo/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg-cool-white: #f4f7f6; --yellow-solid: #ffcc00; --navy-dark: #0f172a; --text-main: #334155; --white-pure: #ffffff; --border-color: #e2e8f0; --yellow-accent: rgba(255, 215, 0, 0.15); }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-cool-white); color: var(--text-main); line-height: 1.8; padding-top: 100px; }

        /* HEADER (Sama Persis) */
        header { background-color: rgba(255, 204, 0, 0.4); backdrop-filter: blur(16px); position: fixed; top: 12px; left: 4%; right: 4%; width: 92%; z-index: 1000; border: 1px solid rgba(255, 255, 255, 0.3); padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; border-radius: 10px; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease; }
        header.scroll-down { transform: translateY(-150%); opacity: 0; }
        header.scroll-up { transform: translateY(0); opacity: 1; background-color: rgba(255, 204, 0, 0.5); }

        .header-left { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .header-logo { height: 32px; width: auto; object-fit: contain; }
        .brand-info { display: flex; flex-direction: column; }
        .brand-title { font-size: 1rem; font-weight: 800; color: var(--navy-dark); line-height: 1.1; }
        .brand-subtitle { font-size: 0.65rem; color: #475569; font-weight: 600; }
        .secret-gate { text-decoration: none; color: inherit; cursor: default; }

        .menu-toggle { display: flex; flex-direction: column; gap: 4px; background: none; border: none; cursor: pointer; padding: 4px; z-index: 1001; }
        .menu-toggle span { display: block; width: 22px; height: 2px; background-color: var(--navy-dark); transition: all 0.3s ease; }

        nav { position: absolute; top: 100%; left: 0; right: 0; background-color: rgba(255, 215, 0, 0.95); backdrop-filter: blur(20px); margin-top: 8px; border-radius: 10px; padding: 15px; opacity: 0; visibility: hidden; transform: translateY(-10px); transition: all 0.3s ease; }
        nav.open { opacity: 1; visibility: visible; transform: translateY(0); }
        nav ul { display: flex; flex-direction: column; list-style: none; gap: 12px; text-align: center; }
        nav ul li a { text-decoration: none; color: var(--navy-dark); font-weight: 700; display: block; }

        /* CONTENT */
        .container { max-width: 800px; margin: 0 auto; padding: 20px 5%; }
        article { background-color: var(--white-pure); border-bottom: 4px solid var(--yellow-solid); margin-bottom: 40px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .detail-banner { width: 100%; max-height: 400px; overflow: hidden; background-color: #e2e8f0; }
        .detail-img { width: 100%; height: 100%; object-fit: cover; }
        .detail-body { padding: 40px 50px; }
        .karya-tag { display: inline-block; background-color: var(--yellow-accent); color: #b45309; font-size: 0.75rem; font-weight: 700; padding: 4px 10px; margin-bottom: 15px; text-transform: uppercase; }
        .karya-title { font-size: 2.3rem; color: var(--navy-dark); font-weight: 800; line-height: 1.3; margin-bottom: 15px; }
        .karya-meta { display: flex; gap: 15px; font-size: 0.85rem; color: #64748b; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); margin-bottom: 30px; }
        .karya-content { font-size: 1.05rem; color: #1e293b; white-space: pre-wrap; }

        @media (min-width: 769px) {
            header { padding: 10px 30px; top: 20px; left: 5%; right: 5%; width: 90%; }
            .menu-toggle { display: none; }
            nav { position: static; opacity: 1; visibility: visible; transform: none; background: none; padding: 0; display: block; }
            nav ul { flex-direction: row; gap: 25px; }
        }
    </style>
</head>
<body>

    <header id="smart-header">
        <div class="header-left" onclick="window.location.href='/index.html'">
            <img src="/image/logo/logo.png" alt="Logo IKSAJ" class="header-logo">
            <div class="brand-info">
                <span class="brand-title">IKSAJ</span>
                <span class="brand-subtitle">Ikatan Santri Annuqayah <a href="/admin.html" class="secret-gate">Jawa</a></span>
            </div>
        </div>
        <button class="menu-toggle" id="menu-btn" aria-label="Buka Menu"><span></span><span></span><span></span></button>
        <nav id="nav-menu">
            <ul>
                <li><a href="/komponen_index/eksplor-berita.html">Eksplor Berita</a></li>
                <li><a href="/komponen_index/eksplor-karya.html">Eksplor Karya</a></li>
            </ul>
        </nav>
    </header>

    <div class="container" id="content-render">
        <p style="text-align:center; padding:50px;">Memuat konten karya...</p>
    </div>

    <script type="module">
        import { supabase } from '/adlan_madjied_ridho/supa.js';

        const menuBtn = document.getElementById('menu-btn');
        const navMenu = document.getElementById('nav-menu');
        const header = document.getElementById('smart-header');
        menuBtn.addEventListener('click', () => navMenu.classList.toggle('open'));

        let lastScrollTop = 0;
        window.addEventListener('scroll', () => {
            let st = window.pageYOffset || document.documentElement.scrollTop;
            if (navMenu.classList.contains('open')) return;
            if (st > lastScrollTop && st > 100) { header.classList.remove('scroll-up'); header.classList.add('scroll-down'); } 
            else { header.classList.remove('scroll-down'); header.classList.add('scroll-up'); }
            lastScrollTop = st;
        });

        async function fetchDetailKarya() {
            const slug = new URLSearchParams(window.location.search).get('slug');
            const { data: karya } = await supabase.from('karya').select('*').eq('slug', slug).single();
            
            if (karya) {
                document.getElementById('content-render').innerHTML = `
                    <article>
                        <div class="detail-banner"><img src="${karya.gambar_url || '/image/logo/logo.png'}" class="detail-img"></div>
                        <div class="detail-body">
                            <span class="karya-tag">${karya.tipe_karya || 'Karya'}</span>
                            <h1 class="karya-title">${karya.judul}</h1>
                            <div class="karya-meta">
                                📅 ${new Date(karya.tanggal_terbit).toLocaleDateString('id-ID')} 
                                👁️ Dilihat ${karya.jumlah_dilihat || 0} kali 
                                ❤️ ${karya.jumlah_like || 0} Suka
                            </div>
                            <div class="karya-content">${karya.konten}</div>
                        </div>
                    </article>`;
                
                await supabase.from('karya').update({ jumlah_dilihat: (karya.jumlah_dilihat || 0) + 1 }).eq('id', karya.id);
            }
        }
        fetchDetailKarya();
    </script>
</body>
</html>
